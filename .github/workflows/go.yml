# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1'

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...

    - name: Test pure Go
      run: go test -v -tags purego ./...

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [386, arm, arm64, amd64, mips, mipsle, mips64, mips64le, ppc64, ppc64le, riscv64, s390x, loong64]
    env:
      GOOS: linux
      GOARCH: ${{ matrix.goarch }}
      GOARM: '5'
      CGO_ENABLED: '0'
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1'

    - name: Compile tests
      run: go test -c -o aes.test .

    - name: Compile pure Go tests
      run: go test -c -tags purego -o aes-purego.test .

    - name: Vet
      run: |
        go vet ./...
        go vet -tags purego ./...
